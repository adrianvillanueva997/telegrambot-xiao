name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt && rustup default 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.13.8
      - name: Check Python workspace
        run: |
          uv sync --locked --all-packages
          uv run --locked --all-packages ruff format --check .
          uv run --locked --all-packages ruff check .
          uv run --locked --all-packages pyrefly check
          uv run --locked --all-packages bandit -c pyproject.toml -r .
          uv run --locked --all-packages python -m unittest discover -s transcriber

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: telegrambot-xiao:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: model
      - name: Smoke-test container runtime
        run: |
          docker run --rm --entrypoint ffmpeg telegrambot-xiao:ci -version
          docker run --rm --entrypoint /bin/sh -e VOSK_MODEL_PATH=/opt/vosk-model telegrambot-xiao:ci -c '
            ffmpeg -v error -f lavfi -i anullsrc=r=16000:cl=mono -t 1 -c:a libopus /tmp/silence.ogg &&
            printf "{\"id\":1,\"path\":\"/tmp/silence.ogg\"}\n" | /app/transcriber/.venv/bin/python /app/transcriber/worker.py
          ' | grep -F '"text":'
          if output=$(docker run --rm telegrambot-xiao:ci 2>&1); then
            echo 'Bot unexpectedly started without configuration' >&2
            exit 1
          fi
          echo "$output" | grep -F 'Cannot get the TELOXIDE_TOKEN env variable'
