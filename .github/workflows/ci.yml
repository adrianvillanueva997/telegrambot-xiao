name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - name: Install Rust
        run: rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt && rustup default 1.100.0
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: telegrambot-xiao:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test container runtime
        run: |
          docker run --rm --entrypoint ffmpeg telegrambot-xiao:ci -version
          if output=$(docker run --rm telegrambot-xiao:ci 2>&1); then
            echo 'Bot unexpectedly started without configuration' >&2
            exit 1
          fi
          echo "$output" | grep -F 'Cannot get the TELOXIDE_TOKEN env variable'
