repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --locked --all-targets -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        entry: cargo test --locked
        language: system
        pass_filenames: false
        always_run: true
      - id: python-lint
        name: Ruff
        entry: uv run --locked --only-group dev ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: python-types
        name: Pyrefly
        entry: uv run --locked --all-packages pyrefly check
        language: system
        pass_filenames: false
        always_run: true
