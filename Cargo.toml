[package]
name = "telegrambot-xiao"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = "0.3"
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", features = ["json"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
teloxide = { version = "0.17", features = ["macros", "webhooks-axum"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "process", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = true
